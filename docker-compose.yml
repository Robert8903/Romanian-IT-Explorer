services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  loader:
    build: ./loader
    env_file: .env
    volumes:
      - rawdata:/data/raw
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
    name: ${DB_VOLUME:-career_dbdata}
  rawdata:
